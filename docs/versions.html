<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versions — Markora MD</title>
  <meta name="description" content="Browse the current and previous MSI releases for Markora MD.">
  <link rel="canonical" href="https://kelvink96.github.io/markora/versions.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/legal.css">
  <style>
    .release-list { display: grid; gap: 14px; margin-top: 8px; }
    .release { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; background: var(--paper-2); }
    .release-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 4px; }
    .release-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--ink); }
    .badge { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 2px 10px; }
    .release-note { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
    .download { font: 600 14px/1 var(--font-ui); text-decoration: none; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 12px 18px; white-space: nowrap; transition: background .15s ease; }
    .download:hover { background: var(--accent); color: #fff; }
    .empty, .loading { color: var(--ink-3); }
    @media (max-width: 700px) {
      .release { grid-template-columns: minmax(0, 1fr); }
      .download { text-align: center; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="./">
        <img src="assets/logo.png" alt="" width="28" height="28">
        Markora
      </a>
      <a class="back" href="./">&larr; Back to home</a>
    </div>
  </header>

  <main>
    <div class="doc-head">
      <h1>Versions</h1>
      <p class="lead">Direct MSI downloads for the latest release and older versions. Useful for manual installs and rollback checks.</p>
    </div>

    <section aria-labelledby="available">
      <h2 id="available">Available versions</h2>
      <div id="release-list" class="release-list">
        <p class="loading">Loading versions…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a class="brand" href="./">Markora</a>
      <nav class="footer-links" aria-label="Footer">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
        <a href="versions.html">Versions</a>
        <a href="https://github.com/kelvink96/markora" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:kelvin.kiprop96@gmail.com">Contact</a>
      </nav>
      <span class="footer-copy">© 2026 Kelvin Kiprop</span>
    </div>
  </footer>

  <script>
    const list = document.getElementById('release-list');

    const render = (items) => {
      if (!items.length) {
        list.innerHTML = '<p class="empty">No releases have been published yet.</p>';
        return;
      }

      list.innerHTML = items.map((item) => {
        const badge = item.current ? '<span class="badge">Current release</span>' : '';
        const published = item.publishedAt ? new Date(item.publishedAt).toLocaleString() : '';

        return `
          <article class="release">
            <div>
              <div class="release-meta">
                <span class="release-title">Markora MD ${item.version}</span>
                ${badge}
              </div>
              <div class="release-note">
                <div>${item.filename}</div>
                <div>${published}</div>
              </div>
            </div>
            <a class="download" href="${item.url}">Download MSI</a>
          </article>
        `;
      }).join('');
    };

    fetch('./releases.json', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('Could not load release manifest.');
        return response.json();
      })
      .then((items) => render(Array.isArray(items) ? items : []))
      .catch(() => {
        list.innerHTML = '<p class="empty">Release history is unavailable right now.</p>';
      });
  </script>
</body>
</html>
