name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Import code-signing certificate
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "markora-signing-cert.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          )
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found in the Windows SDK."
          }

          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign MSI
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          if (-not $msiFiles) {
            throw "No MSI files found to sign."
          }

          foreach ($msi in $msiFiles) {
            & "$env:SIGNTOOL_PATH" sign `
              /f "$env:WINDOWS_CERTIFICATE_PATH" `
              /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" `
              /fd SHA256 `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              "$($msi.FullName)"

            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $($msi.FullName)"
            }
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: markora-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Renaming does not touch the Authenticode signature. A clean name keeps the
      # release asset URL predictable (GitHub rewrites spaces to dots).
      - name: Stage MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          $staged = Join-Path $env:RUNNER_TEMP "Markora-MD_$version.msi"
          Copy-Item -LiteralPath $msi.FullName -Destination $staged
          "STAGED_MSI=$staged" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" $env:STAGED_MSI `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      # The in-app updater reads docs/latest.json from GitHub Pages. The updater
      # signature must be made after Authenticode signing, since that changes the file.
      - name: Publish updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $name = Split-Path $env:STAGED_MSI -Leaf
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"

          npx tauri signer sign $env:STAGED_MSI
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed" }

          $notes = gh release view $tag --json body --jq .body
          node scripts/build-update-manifest.mjs --version $version --url $url `
            --signature-file "$env:STAGED_MSI.sig" "--notes=$notes" --out "$env:RUNNER_TEMP/latest.json"
          if ($LASTEXITCODE -ne 0) { throw "build-update-manifest failed" }

          git fetch origin main
          git checkout -B main origin/main
          Copy-Item "$env:RUNNER_TEMP/latest.json" docs/latest.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git commit -m "chore: publish updater manifest for $tag"
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }
